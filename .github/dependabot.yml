# Opens weekly pull requests to keep dependencies up to date.
# Each one runs through CI, so a broken update is caught before it reaches main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /portfolio-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
