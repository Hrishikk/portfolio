# Continuous Deployment
#
# On every push to main (i.e. when a pull request is merged), this workflow:
#   1. runs the CI workflow (lint, type-check, build) and keeps its build output,
#   2. signs in to AWS with a short-lived token via GitHub OIDC (no stored access keys),
#   3. uploads the site to S3 and clears the CloudFront cache so visitors get the new version.
#
# Required GitHub configuration (Settings → Environments → "production" → Environment variables):
#   AWS_ROLE_ARN                 IAM role GitHub Actions assumes, e.g. arn:aws:iam::123456789012:role/portfolio-deploy
#   AWS_REGION                   Region of the S3 bucket, e.g. ap-northeast-1
#   S3_BUCKET                    Bucket name only, without s3://
#   CLOUDFRONT_DISTRIBUTION_ID   e.g. E1A2B3C4D5E6F7
#   SITE_URL                     Public URL, shown on the deployment, e.g. https://d111111abcdef8.cloudfront.net

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

# Only one deployment at a time; a newer one waits instead of cancelling a half-finished upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to AWS (S3 + CloudFront)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token to sign in to AWS
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Check deployment settings
        run: |
          missing=0
          for name in AWS_ROLE_ARN AWS_REGION S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing environment variable '$name' in the 'production' environment."
              missing=1
            fi
          done
          exit $missing

      - name: Download the built site from CI
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Files in assets/ have a content hash in their name (e.g. index-BDsBMRpC.js), so a changed
      # file always gets a new name. They can safely be cached by browsers for a year.
      - name: Upload hashed assets (long cache)
        run: >
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets"
          --delete
          --cache-control "public,max-age=31536000,immutable"

      # index.html, favicon etc. keep the same name, so browsers must re-check them on every visit.
      # Uploaded after the assets, so the new index.html never points at files that aren't there yet.
      - name: Upload index.html and other files (no cache)
        run: >
          aws s3 sync dist "s3://$S3_BUCKET"
          --delete
          --exclude "assets/*"
          --cache-control "public,max-age=0,must-revalidate"

      - name: Clear the CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
          --query "Invalidation.Id"
          --output text

      - name: Summary
        run: |
          {
            echo "### Deployed :rocket:"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Bucket: \`$S3_BUCKET\`"
            echo "- URL: ${{ vars.SITE_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
