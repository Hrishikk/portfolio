# Continuous Integration
#
# Runs on every pull request into main, and is reused by deploy.yml before each deployment.
# Fails if the frontend doesn't lint, type-check or build. On success, the built site
# (portfolio-frontend/dist) is uploaded as the "site" artifact so it can be deployed as-is.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A new push to the same pull request cancels the older, now outdated run.
# Runs started by deploy.yml (no PR number) get a unique group and are never cancelled here.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio-frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: portfolio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: portfolio-frontend/dist
          if-no-files-found: error
          retention-days: 7
